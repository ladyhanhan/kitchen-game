<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fridge Body (Metallic Silver) -->
  <rect x="15" y="10" width="70" height="85" rx="4" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
  
  <!-- Glass Door Frame -->
  <rect x="20" y="15" width="60" height="75" rx="2" fill="#CFD8DC" stroke="#90A4AE" stroke-width="1"/>
  
  <!-- Glass Window (Blueish Tint) -->
  <rect x="25" y="20" width="50" height="65" fill="#E1F5FE" opacity="0.9"/>
  
  <!-- Inner Shelf Lines (Visible through glass) -->
  <line x1="25" y1="40" x2="75" y2="40" stroke="#B0BEC5" stroke-width="1" opacity="0.5"/>
  <line x1="25" y1="60" x2="75" y2="60" stroke="#B0BEC5" stroke-width="1" opacity="0.5"/>
  
  <!-- Glass Reflection (Diagonal Streaks) -->
  <path d="M25 85 L55 20 L65 20 L35 85 Z" fill="white" opacity="0.2"/>
  <path d="M45 85 L75 20 L80 20 L50 85 Z" fill="white" opacity="0.15"/>
  
  <!-- Handle -->
  <rect x="70" y="45" width="4" height="15" rx="1" fill="#546E7A"/>
  
  <!-- Cold/Frost Effect (Subtle Gradient or Glow) -->
  <defs>
    <linearGradient id="frost" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E1F5FE;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#81D4FA;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <rect x="25" y="20" width="50" height="65" fill="url(#frost)"/>
</svg>