<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Cabinet Body -->
  <rect x="15" y="10" width="70" height="80" rx="2" fill="#8B4513" stroke="#5D4037" stroke-width="2"/>
  <!-- Top decorative panel -->
  <rect x="15" y="10" width="70" height="10" rx="2" fill="#A0522D"/>
  
  <!-- Shelves -->
  <rect x="20" y="35" width="60" height="4" fill="#DEB887"/>
  <rect x="20" y="60" width="60" height="4" fill="#DEB887"/>
  
  <!-- Items on Top Shelf -->
  <rect x="25" y="20" width="10" height="15" fill="#CD853F" stroke="#5D4037" stroke-width="1"/>
  <circle cx="45" cy="27" r="7" fill="#FF6347" stroke="#8B0000" stroke-width="1"/>
  <rect x="58" y="22" width="12" height="13" fill="#F4A460" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Items on Bottom Shelf -->
  <rect x="22" y="45" width="15" height="15" fill="#C0C0C0" stroke="#696969" stroke-width="1"/>
  <rect x="42" y="42" width="10" height="18" fill="#556B2F" stroke="#2F4F4F" stroke-width="1"/>
  <circle cx="65" cy="52" r="6" fill="#FFD700" stroke="#B8860B" stroke-width="1"/>
  
  <!-- Bottom storage area -->
  <rect x="20" y="65" width="60" height="20" fill="#6B4226" opacity="0.5"/>
  <line x1="50" y1="65" x2="50" y2="85" stroke="#5D4037" stroke-width="1"/>
</svg>